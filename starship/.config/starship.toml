format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$bun\
$deno\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[aws]
disabled = true

[gcloud]
disabled = true

[package]
disabled = true
